name: 每日科技 & GitHub 日报

on:
  schedule:
    # 每天北京时间 9:00 执行（UTC 1:00）
    - cron: '0 7 * * *'
  workflow_dispatch:  # 允许手动运行

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 Python 依赖
        run: pip install feedparser requests beautifulsoup4 html5lib

      - name: 执行日报脚本
        run: python main.py
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}   # 注意拼写
          # APP_TOKEN: ${{ secrets.APP_TOKEN }}
          # USER_UID: ${{ secrets.USER_UID }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
